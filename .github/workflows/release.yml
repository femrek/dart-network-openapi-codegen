name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode package -DskipTests

      - name: Get JAR file path
        id: jar
        run: echo "path=$(ls target/*.jar | head -n 1)" >> $GITHUB_OUTPUT

      - name: Extract Release Notes
        id: extract_notes
        run: |
          # Extracts the latest release block from CHANGELOG.md (from the first '## ' up to the next '## ')
          awk '/^## /{ if (p) { exit }; p=1; next } p{ print }' CHANGELOG.md > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.jar.outputs.path }}
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

